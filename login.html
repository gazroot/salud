<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | Salud en Orden</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-50 flex items-center justify-center p-4"><main class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-8"><div class="text-center mb-6"><div class="mx-auto mb-3 w-14 h-14 rounded-2xl bg-blue-100 text-blue-800 grid place-items-center text-2xl">♥</div><h1 class="text-2xl font-bold text-slate-900">Salud en Orden</h1><p class="text-slate-600 mt-2">Tu seguimiento personal, de forma privada.</p></div><section id="panel-login" data-auth-panel><form id="signin-form" class="grid gap-4"><label class="grid gap-1 text-sm font-medium">Correo electrónico<input class="border rounded-lg p-3" type="email" name="email" autocomplete="email" required></label><label class="grid gap-1 text-sm font-medium">Contraseña<input class="border rounded-lg p-3" type="password" name="password" autocomplete="current-password" required></label><button class="rounded-lg bg-blue-800 text-white p-3 font-semibold" type="submit">Iniciar sesión</button></form><div class="flex justify-between gap-3 mt-4 text-sm"><button class="text-blue-800 underline" type="button" data-show-panel="panel-register">Crear cuenta</button><button class="text-blue-800 underline" type="button" data-show-panel="panel-reset">Olvidé mi contraseña</button></div></section><section id="panel-register" data-auth-panel hidden><h2 class="font-bold text-lg mb-3">Crear cuenta</h2><form id="signup-form" class="grid gap-4"><label class="grid gap-1 text-sm font-medium">Correo electrónico<input class="border rounded-lg p-3" type="email" name="email" autocomplete="email" required></label><label class="grid gap-1 text-sm font-medium">Contraseña (mínimo 10 caracteres)<input class="border rounded-lg p-3" type="password" name="password" autocomplete="new-password" minlength="10" required></label><label class="grid gap-1 text-sm font-medium">Confirmar contraseña<input class="border rounded-lg p-3" type="password" name="confirmPassword" autocomplete="new-password" minlength="10" required></label><button class="rounded-lg bg-blue-800 text-white p-3 font-semibold" type="submit">Registrarme</button></form><button class="mt-4 text-blue-800 underline text-sm" type="button" data-show-panel="panel-login">Volver al inicio de sesión</button></section><section id="panel-reset" data-auth-panel hidden><h2 class="font-bold text-lg mb-3">Recuperar contraseña</h2><form id="reset-form" class="grid gap-4"><label class="grid gap-1 text-sm font-medium">Correo electrónico<input class="border rounded-lg p-3" type="email" name="email" autocomplete="email" required></label><button class="rounded-lg bg-blue-800 text-white p-3 font-semibold" type="submit">Enviar enlace</button></form><button class="mt-4 text-blue-800 underline text-sm" type="button" data-show-panel="panel-login">Volver al inicio de sesión</button></section><p data-auth-message hidden aria-live="polite" class="mt-4 text-sm"></p><p class="text-xs text-slate-500 mt-6">No introduzcas datos médicos sensibles hasta completar y probar la configuración de seguridad.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
