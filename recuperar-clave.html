<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restablecer contraseña | Salud en Orden</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="supabase-config.js"></script><script defer src="auth.js"></script></head><body class="min-h-screen bg-slate-50 flex items-center justify-center p-4"><main class="w-full max-w-md bg-white rounded-2xl border p-6 shadow"><h1 class="text-2xl font-bold text-blue-900">Crear nueva contraseña</h1><p class="text-sm text-slate-600 my-3">Abre esta página desde el enlace de recuperación enviado a tu correo.</p><form id="new-password-form" class="space-y-4"><label class="block text-sm">Nueva contraseña (mínimo 10 caracteres)<input required minlength="10" name="password" type="password" autocomplete="new-password" class="mt-1 w-full rounded-lg border-slate-300"></label><label class="block text-sm">Confirmar contraseña<input required minlength="10" name="confirmPassword" type="password" autocomplete="new-password" class="mt-1 w-full rounded-lg border-slate-300"></label><button class="w-full rounded-lg bg-blue-800 text-white py-3 font-semibold">Guardar contraseña</button></form><p data-auth-message role="status" aria-live="polite" hidden class="mt-4 text-sm"></p><a href="login.html" class="block mt-4 text-blue-800 underline text-sm">Volver al inicio de sesión</a></main></body></html>
