<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar contraseña | Salud en Orden</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-50 flex items-center justify-center p-4"><main class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-8"><h1 class="text-2xl font-bold">Crear nueva contraseña</h1><p class="text-slate-600 my-3">Escribe una nueva contraseña para tu cuenta.</p><form id="new-password-form" class="grid gap-4"><label class="grid gap-1 text-sm font-medium">Nueva contraseña<input class="border rounded-lg p-3" type="password" name="password" minlength="10" required autocomplete="new-password"></label><label class="grid gap-1 text-sm font-medium">Confirmar contraseña<input class="border rounded-lg p-3" type="password" name="confirmPassword" minlength="10" required autocomplete="new-password"></label><button class="rounded-lg bg-blue-800 text-white p-3 font-semibold" type="submit">Actualizar contraseña</button></form><p data-auth-message hidden aria-live="polite" class="mt-4 text-sm"></p><a class="inline-block mt-4 text-blue-800 underline" href="login.html">Volver al inicio de sesión</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
