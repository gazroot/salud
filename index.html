<script id="salud-sidebar-toggle">
(() => {
  const sidebar = document.getElementById('salud-app-sidebar');
  const overlay = document.getElementById('salud-mobile-overlay');
  const toggle = document.getElementById('salud-mobile-menu-button');
  if (!sidebar || !overlay || !toggle) return;
  const closeMenu = () => {
    sidebar.classList.remove('salud-sidebar-open');
    overlay.classList.remove('salud-overlay-open');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Abrir menú');
  };
  const openMenu = () => {
    sidebar.classList.add('salud-sidebar-open');
    overlay.classList.add('salud-overlay-open');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', 'Cerrar menú');
  };
  toggle.addEventListener('click', () => {
    sidebar.classList.contains('salud-sidebar-open') ? closeMenu() : openMenu();
  });
  overlay.addEventListener('click', closeMenu);
  sidebar.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
})();
       
const logoutButton = document.getElementById('salud-logout-button');

if (logoutButton) {
  logoutButton.addEventListener('click', async () => {
    const client = window.saludSupabase;

    if (!client) {
      alert('No se pudo conectar con Supabase.');
      return;
    }

    logoutButton.disabled = true;
    logoutButton.textContent = 'Cerrando sesión...';

    try {
      const { error } = await client.auth.signOut();

      if (error) {
        throw error;
      }

      window.location.replace('login.html');
    } catch (error) {
      alert('No se pudo cerrar la sesión: ' + error.message);
      logoutButton.disabled = false;
      logoutButton.textContent = 'Cerrar sesión';
    }
  });
}

</script>
